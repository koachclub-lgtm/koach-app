# KOACH nativa · compila el APK de prueba de Android en GitHub (no toca producción ni Vercel)
name: KOACH Android (APK de prueba)
on:
  workflow_dispatch:
  push:
    paths: ['native/**', '.github/workflows/koach-android.yml']   # cambios solo web: lanzar a mano (ahorra minutos de CI)
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Dependencias
        working-directory: native
        run: npm ci
      - name: Empaquetar web + sincronizar Android
        working-directory: native
        run: npm run web && npx cap sync android
      - name: Compilar APK debug
        working-directory: native/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: koach-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Publicar APK con enlace directo (release "apk-prueba")
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp native/android/app/build/outputs/apk/debug/app-debug.apk KOACH-prueba.apk
          gh release delete apk-prueba --yes --cleanup-tag || true
          gh release create apk-prueba KOACH-prueba.apk --prerelease --target "${{ github.sha }}" \
            --title "KOACH · APK de prueba" --notes "Versión de prueba para instalar en Android. No es la versión de tienda."
