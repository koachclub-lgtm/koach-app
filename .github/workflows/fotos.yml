name: fotos
on:
  push:
    branches: [tmp-fotos]
permissions:
  contents: write
jobs:
  f:
    if: "!contains(github.event.head_commit.message, 'fotos listas')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ex && cd ex
          for f in assault-bike_m_v1 full-plank-iso_m_v1 db-thruster_m_v1; do curl -sf -o $f.webp https://siecbdatfgmqbpxqtvsl.supabase.co/storage/v1/object/public/ejercicios-media/ex/$f.webp; done
          cd .. && git config user.name bot && git config user.email bot@users.noreply.github.com && git add ex && git commit -m "fotos listas" && git push
